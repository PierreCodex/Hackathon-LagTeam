title = "Alta de evento por el organizador"
description = "Entrega el formulario híbrido del organizador: datos del evento, elegir una sede existente o crear una de zona general con capacidad, categorías de precio con IGV incluido en céntimos, 2-3 frases, foto del evento y la pregunta '¿Habrá música?' con subida de la constancia de APDAYC a Storage; el evento queda pendiente (CAP-2). Las sedes numeradas y el precio por rango de asientos son de la pizarra del epic 2."
verify = "Un organizador completa el alta desde el móvil en menos de 2 minutos y el evento queda pendiente; si marca música sin constancia, no puede enviar."
covers = ["CAP-2"]
after = [2, 3]
hitl = false
risk = "medium"

