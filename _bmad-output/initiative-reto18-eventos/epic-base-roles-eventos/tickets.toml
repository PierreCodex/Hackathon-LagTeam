title = "Esquema de sedes, mapa y eventos"
description = "Crea las migraciones de sede > sección (numerada|general con capacidad) > fila > bloque > asiento, eventos (estado, destacado, inicio, distrito, categoría, descripción, hay_musica, constancia) y categorías de precio del evento, sus esquemas zod en packages/shared y seed.sql con la sede de ejemplo de los croquis y los eventos de la demo (CAP-2, AD-4); el organizador se enlaza a auth.users para no depender de la historia 2. Es el contrato que usan la pizarra del epic 2 y la IA del epic 3."
verify = "La migración se aplica en Supabase, la semilla carga y las filas, bloques y asientos de la sede de ejemplo coinciden con los dos croquis de insumos/."
