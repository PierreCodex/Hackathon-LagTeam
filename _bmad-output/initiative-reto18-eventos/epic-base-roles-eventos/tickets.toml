title = "API: alta de evento"
description = "Añade los endpoints del organizador para crear un evento con sede existente o nueva de zona general con capacidad, categorías de precio con IGV incluido en céntimos, 2-3 frases, foto y '¿Habrá música?', con subida de la foto y la constancia de APDAYC a Storage; el evento queda pendiente y se rechaza si hay música sin constancia (CAP-2). Las sedes numeradas y el precio por rango son de la pizarra del epic 2."
verify = "Pruebas de integración: un alta válida deja el evento pendiente con sus categorías, y un alta con música sin constancia responde error con su código."
covers = ["CAP-2"]
after = [2, 3]
hitl = false
risk = "medium"
assignee = "Jean Pierre"

