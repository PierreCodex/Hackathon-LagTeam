[[entry]]
id = 2
type = "story"
title = "Registro, inicio de sesión y roles"
description = "Añade Supabase Auth, la tabla identidad_perfiles (rol admin|organizador|publico, WhatsApp en E.164, ciudad opcional y consentimiento de avisos), el guard @Roles() en la API, un administrador sembrado y menús por rol en la web (CAP-1, AD-3); el WhatsApp del perfil es el que usa el epic 2 para enviar el QR."
verify = "Con tres cuentas en un móvil, cada rol ve solo su menú y la API responde 403 cuando un rol llama a un endpoint de otro."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "low"

