# Historias del epic 1 (Base, roles y eventos), en orden de construcción. tickets.py lee este archivo.
# `assignee` es una clave propia del equipo (tickets.py la ignora): dice quién construye cada historia.

[[entry]]
id = 1
type = "story"
title = "Esqueleto desplegado"
description = "Monta el monorepo pnpm con apps/web (Next.js >= 16.3.3), apps/api (NestJS 12) y packages/shared, con una página que llama a /api/v1/salud y esta consulta Supabase, desplegado en Vercel y Railway Hobby con CI de compilación y lint; es la base que necesitan todos los epics."
verify = "Desde un móvil, la URL de Vercel muestra 'API ok · BD ok' con datos leídos de Supabase a través de la API desplegada en Railway."
covers = []
after = []
hitl = true
risk = "medium"
assignee = "Jean Pierre"
references = ["architecture-reto18-plataforma-eventos/architecture-reto18-plataforma-eventos.md#semilla-estructural", "architecture-reto18-plataforma-eventos/architecture-reto18-plataforma-eventos.md#stack"]
notes = ["Persona: Jean Pierre crea los proyectos de Supabase, Vercel y Railway Hobby (su cuenta), conecta GitHub y carga las variables de .env.example."]

[[entry]]
id = 7
type = "story"
title = "UI: sistema de diseño y layout móvil"
description = "Fija la paleta de colores y la tipografía de la plataforma (no la de las piezas de marketing, que genera la IA), elige la librería de UI y deja en apps/web los componentes base (botones, formularios, tarjetas, avisos de error y de carga), el layout móvil con cabecera y navegación, y un cliente HTTP que lee el formato de error de la API; es la base de todas las pantallas."
verify = "Una página de muestra en Vercel enseña la paleta y los componentes base y se ve bien en un móvil de 360 px sin scroll horizontal."
covers = []
after = [1]
hitl = false
risk = "low"
assignee = "Sandro David"
references = ["ux-plataforma-eventos/DESIGN.md", "ux-plataforma-eventos/EXPERIENCE.md", "ux-plataforma-eventos/mockups/"]
notes = ["La paleta y el estilo de la plataforma salen del DESIGN.md de Manuel Alexis (basado en el manual de marca del Club)."]

