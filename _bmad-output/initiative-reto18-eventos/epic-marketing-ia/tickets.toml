[[entry]]
id = 1
type = "story"
title = "Primera pieza con IA"
description = "Crea el módulo ia con el adaptador de Ollama, tiempo límite y respuesta de respaldo (AD-11), la función textosYCampaña (textos, paleta y campaña con público objetivo, presupuesto en soles y calendario), la plantilla 4:5 renderizada a PNG con next/og (AD-12) y la pantalla 'Marketing' del organizador (CAP-8); el epic 5 añade su función leerCroquis sobre este módulo."
verify = "Sobre un evento sembrado, el organizador pulsa 'Generar' y ve el flyer 4:5 y la campaña con fecha, sede y precio exactos; con Ollama apagado se muestra la respuesta de respaldo."
covers = ["CAP-8"]
after = ["1.2", "1.3"]
hitl = true
risk = "high"
notes = ["Persona: Jean Pierre levanta Ollama y el túnel en su PC, elige el modelo y carga OLLAMA_URL en Railway."]

