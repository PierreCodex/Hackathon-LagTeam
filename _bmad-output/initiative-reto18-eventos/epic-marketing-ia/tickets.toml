# Historias del epic 3 (Marketing con IA), en orden de construcción. tickets.py lee este archivo.
# Cada función de IA vive en su propio archivo (apps/api/src/ia/funciones/<nombre>.ts) para que historias en paralelo no choquen.
# `assignee` es una clave propia del equipo (tickets.py la ignora): dice quién construye cada historia.

[[entry]]
id = 1
type = "story"
title = "API: módulo ia y primera campaña"
description = "Crea el módulo ia con el adaptador de Ollama, tiempo límite y respuesta de respaldo (AD-11), la función textosYCampaña (textos, paleta y campaña con público objetivo, presupuesto en soles y calendario), y el endpoint del organizador que genera y guarda la pieza de un evento con sus datos para la plantilla (CAP-8); el epic 5 añade su función leerCroquis sobre este módulo."
verify = "Pruebas de integración sobre un evento sembrado: el endpoint devuelve textos y campaña con fecha, sede y precio exactos; con Ollama apagado devuelve la respuesta de respaldo."
covers = ["CAP-8"]
after = ["1.2", "1.3"]
hitl = true
risk = "high"
assignee = "Jean Pierre"
notes = ["Persona: Jean Pierre levanta Ollama y el túnel en su PC, elige el modelo y carga OLLAMA_URL en Railway."]

