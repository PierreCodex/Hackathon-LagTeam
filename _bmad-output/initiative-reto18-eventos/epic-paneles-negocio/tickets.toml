after = ["2.1", "3.2"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Comisión configurable y liquidación"
description = "Entrega al administrador la configuración del modelo de ingresos (comisión por entrada en porcentaje o importe fijo, o tarifa por evento), guardada a través del servicio de ventas en ventas_config_comision, y la liquidación por organizador: ventas brutas menos comisión congelada (CAP-12, AD-10). Con tarifa por evento, la orden congela modelo y tarifa con importe 0 y la liquidación descuenta la tarifa una sola vez por evento con el valor congelado de su primera orden pagada."
verify = "Al cambiar la comisión, las ventas nuevas usan la nueva y las ya pagadas conservan la suya, y la liquidación de un organizador cuadra con un cálculo hecho a mano."
covers = ["CAP-12"]
after = [1]
hitl = false
risk = "medium"

