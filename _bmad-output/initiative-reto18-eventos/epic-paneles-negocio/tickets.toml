# Historias del epic 4 (Paneles y negocio), en orden de construcción. tickets.py lee este archivo.
# `assignee` es una clave propia del equipo (tickets.py la ignora): dice quién construye cada historia.

# Recorte final: bloque B, sobre la consulta base de ventas que publica Luis Armando.
[[entry]]
id = 1
type = "story"
title = "API: ventas del organizador"
description = "Crea el módulo negocio y el endpoint de ventas del organizador por evento, por categoría de precio y por pieza, leyendo de ventas y marketing solo a través de sus servicios (CAP-11, AD-2, AD-8)."
verify = "Pruebas de integración: la compra hecha desde el enlace de una pieza aparece en el endpoint del organizador, asignada a esa pieza."
covers = ["CAP-11"]
after = ["2.1", "3.2"]
hitl = false
risk = "low"
assignee = "Sandro David"

# Recorte final: bloque B.
[[entry]]
