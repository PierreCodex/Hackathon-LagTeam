# Recorte final: bloque C.
[[entry]]
id = 2
type = "story"
title = "API: comisión configurable y liquidación"
description = "Añade los endpoints del administrador para configurar el modelo de ingresos (comisión por entrada en porcentaje o importe fijo, o tarifa por evento), guardado a través del servicio de ventas en ventas_config_comision, y la liquidación por organizador: ventas brutas menos comisión congelada (CAP-12, AD-10). Con tarifa por evento, la orden congela modelo y tarifa con importe 0 y la liquidación descuenta la tarifa una sola vez por evento con el valor congelado de su primera orden pagada."
verify = "Pruebas de integración: al cambiar la comisión, las ventas nuevas usan la nueva y las ya pagadas conservan la suya, y la liquidación de un organizador cuadra con un cálculo hecho a mano."
covers = ["CAP-12"]
after = [1]
hitl = false
risk = "medium"
assignee = "Luis Armando"

# Recorte final: bloque C.
[[entry]]
id = 5
type = "story"
title = "UI: comisión y liquidación"
description = "Entrega al administrador la pantalla para elegir el modelo de ingresos y su valor, y la tabla de liquidación por organizador (CAP-12)."
verify = "Desde el móvil, el administrador cambia la comisión, hace una compra nueva y la liquidación del organizador refleja la nueva comisión solo en esa venta."
covers = ["CAP-12"]
after = [2, "1.12"]
hitl = false
risk = "low"
assignee = "Luis Armando"
notes = ["Reserva: si Sandro David va cargado, la toma quien termine primero."]

