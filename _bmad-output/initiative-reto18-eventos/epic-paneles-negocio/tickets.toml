[[entry]]
id = 1
type = "story"
title = "Panel de ventas del organizador"
description = "Crea el módulo negocio y el panel del organizador con sus ventas por evento, por categoría de precio y por pieza, leyendo de ventas y marketing solo a través de sus servicios (CAP-11, AD-2, AD-8)."
verify = "La compra de la demo hecha desde el enlace de una pieza aparece en el panel del organizador, asignada a esa pieza, segundos después."
