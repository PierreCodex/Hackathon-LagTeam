verify = "Pruebas de integración: guardar el mapa de uno de los croquis de ejemplo y leerlo devuelve las mismas secciones, filas, bloques y numeración; editar una sede con eventos aprobados se rechaza y duplicarla funciona."
covers = ["CAP-15"]
after = ["1.3"]
hitl = false
risk = "medium"
assignee = "Jean Pierre"
references = ["spec-reto18-plataforma-eventos/mapa-asientos.md"]

