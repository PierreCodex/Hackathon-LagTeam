# Historias del epic 2 (Compra, butacas y acceso), en orden de construcción. tickets.py lee este archivo.
# `assignee` es una clave propia del equipo (tickets.py la ignora): dice quién construye cada historia.

[[entry]]
id = 1
type = "story"
title = "API: compra mínima y validación en puerta"
description = "Recorre en la API una entrada de zona general de un evento sembrado: orden pendiente > pagada | expirada, pago simulado tras la interfaz PasarelaPago (tarjeta, Yape, Plin), cupo atómico (AD-5), ventas_config_comision con comisión por entrada por defecto y congelada en la orden (AD-10), ref guardado en la orden y servicio de lectura de ventas por ref para el epic 3 (AD-8), entradas con QR firmado HMAC, endpoint de 'mis entradas', endpoint de validación de un solo uso con usada_en para el epic 4 (AD-7), y notificaciones.encolar() que solo escribe en la bandeja de salida (AD-9)."
verify = "Pruebas de integración: se paga una orden simulada, 'mis entradas' devuelve el QR firmado, la validación lo acepta y al segundo intento lo rechaza, y la bandeja de salida tiene una fila pendiente."
covers = ["CAP-5", "CAP-6", "CAP-7"]
after = ["1.2", "1.3"]
hitl = false
risk = "high"
assignee = "Jean Pierre"

[[entry]]
id = 8
type = "story"
title = "UI: compra, Mis entradas y escáner"
description = "Entrega al público el checkout de zona general con pago simulado (tarjeta, Yape, Plin) y el WhatsApp del perfil prellenado, que envía con la orden el ?ref= con el que llegó el comprador (AD-8), 'Mis entradas' con el QR, y la pantalla de escáner de la puerta con la cámara del móvil en línea (CAP-5, CAP-6, CAP-7)."
verify = "Desde un móvil se compra una entrada general con pago simulado, el QR aparece en 'Mis entradas', el escáner de otro móvil lo acepta y al segundo escaneo lo rechaza."
covers = ["CAP-5", "CAP-6", "CAP-7"]
after = [1, "1.8"]
hitl = false
risk = "medium"
assignee = "Sandro David"

[[entry]]
id = 2
type = "story"
title = "QR por WhatsApp con Evolution API"
description = "Despliega Evolution API v2 en Railway (con su Postgres y su Redis) y añade al módulo notificaciones el proceso que envía la bandeja de salida con 3 reintentos y marca enviado|fallido, enviando la imagen del QR al pagar (CAP-6, AD-9); el epic 3 reutiliza este servicio para los avisos de campaña."
verify = "Tras pagar, el QR llega al WhatsApp del comprador; con Evolution API detenido la compra se completa y el envío queda como fallido tras 3 intentos."
covers = ["CAP-6"]
after = [1]
hitl = true
risk = "high"
assignee = "Jean Pierre"
unknown = "Si Evolution API envía la imagen del QR de forma estable con el número de prueba del equipo."
notes = ["Persona: vincular el número de prueba del equipo escaneando el QR de Evolution API; nunca el número del Club."]

